name: ai_quiz_app
description: AI-Powered Quiz Application using Flutter and FLAN-T5

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5

  # Navigation
  go_router: ^13.0.0

  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.2

  # Database (SQLite)
  sqflite: ^2.3.0
  path: ^1.8.3

  # File Picker
  file_picker: ^8.0.0

  # Shared Preferences
  shared_preferences: ^2.2.2

  # UI
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  lottie: ^2.7.0
  percent_indicator: ^4.2.3
  fl_chart: ^0.65.0

  # Utils
  intl: ^0.18.1
  uuid: ^4.2.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  bloc_test: ^9.1.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
